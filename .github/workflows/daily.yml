name: daily-kpi-report
on:
  schedule:
    - cron: "0 0 * * 1-5"      # 07:00 WIB (UTC+7), run utama
    - cron: "0 1-7 * * 1-5"    # 08:00-14:00 WIB, ulang: run gagal / data terlambat (pesan tidak dikirim dua kali)
  workflow_dispatch:
    inputs:
      report_date:
        description: "Tanggal produksi (YYYY-MM-DD); kosong = hari kerja sebelumnya"
        required: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: project/requirements.txt}
      - run: pip install -r project/requirements.txt
      - name: Tes
        run: python -m pytest project/tests -q
      - name: Siapkan data demo dan database
        run: |
          cd project
          python code/1-data-preparation/python/01_generate_data.py
          python code/1-data-preparation/python/02_clean_data.py
          python code/1-data-preparation/python/03_build_db.py
      - name: Kirim laporan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd project/code/2-analysis/python
          SENDER=dryrun; [ -n "$TELEGRAM_BOT_TOKEN" ] && SENDER=telegram
          python -m bot.run_daily --date "${{ inputs.report_date || '2026-03-30' }}" --sender $SENDER
